<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lax Tracker" />
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
<meta name="theme-color" content="#0A130E" />
<title>Lax Tracker</title>
<style>
  :root{
    --bg:#0A130E; --bg2:#0F1C15; --card:#13241B; --card2:#182E22;
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --ink:#EAF2EC; --muted:#90A99B;
    --us:#FFC233; --us2:#E8A400; --them:#9DB4FF;
    --ball:#FF6B2C; --ballsoft:rgba(255,107,44,.14);
    --go:#37C46C; --danger:#FF5C5C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #14271C 0%, var(--bg) 60%) fixed;
    min-height:100vh; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:14px; padding-bottom:40px;
    display:flex; justify-content:center;
  }
  .phone{width:100%; max-width:460px; display:flex; flex-direction:column; gap:12px;}
  .lcd{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; font-weight:800; letter-spacing:-.02em;}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700;}

  .head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 4px;}
  .opp{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;}
  .opp input{background:transparent; border:none; color:var(--ink); font-size:20px; font-weight:800; padding:0; width:100%; outline:none;}
  .opp input::placeholder{color:var(--muted);}
  .period{display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 6px;}
  .period .lbl{min-width:54px; text-align:center; font-size:13px; font-weight:800;}
  .istep{width:30px; height:30px; border-radius:999px; border:none; background:var(--card2); color:var(--ink); font-size:18px; line-height:1; cursor:pointer;}
  .istep:active{transform:scale(.94);}

  .board{position:relative; background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line2); border-radius:18px; padding:18px 16px 16px; overflow:hidden;}
  .hash{position:absolute; top:0; left:0; right:0; height:8px; background-image:repeating-linear-gradient(90deg, var(--line2) 0 2px, transparent 2px 16px); opacity:.7;}
  .board-row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px;}
  .team{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .team .name{font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:800; color:var(--muted); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .num{font-size:clamp(56px,19vw,90px); line-height:.9;}
  .num.us{color:var(--us); text-shadow:0 0 26px rgba(255,194,51,.35);}
  .num.them{color:var(--them); text-shadow:0 0 26px rgba(157,180,255,.22);}
  .dash{font-size:34px; color:var(--muted); font-weight:800;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;}
  .card-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}

  .gentry{display:flex; gap:8px; margin-bottom:10px;}
  .field{flex:1; display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; padding-left:2px;}
  .numin{background:var(--bg2); border:1px solid var(--line); border-radius:11px; color:var(--ink); font-size:22px; font-weight:800; text-align:center; padding:11px 6px; width:100%; outline:none; font-family:ui-monospace,Menlo,monospace;}
  .numin:focus{border-color:var(--us);}
  .numin:disabled{opacity:.35;}
  .numin::placeholder{color:var(--muted); font-weight:700;}

  .toggles{display:flex; gap:8px; margin-bottom:10px;}
  .chip{flex:1; background:var(--bg2); border:1px solid var(--line); color:var(--muted); border-radius:11px; padding:9px; font-size:13px; font-weight:700; cursor:pointer;}
  .chip[data-on="true"]{background:rgba(255,194,51,.14); border-color:var(--us2); color:var(--us);}
  .chip:active{transform:scale(.97);}

  .btn{width:100%; border:none; border-radius:13px; padding:15px; font-size:16px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn:active{transform:scale(.985);}
  .btn:disabled{opacity:.4;}
  .btn-go{background:linear-gradient(180deg,#3ED77A,var(--go)); color:#04210F;}
  .btn-them{background:var(--card2); color:var(--them); border:1px solid var(--line2); margin-top:8px; font-size:14px; padding:12px;}
  .btn-face{background:linear-gradient(180deg,#5FE6D2,#3FC9B6); color:#04231E;}

  .son{border:1px solid var(--line2); background:linear-gradient(180deg, rgba(255,107,44,.06), var(--card));}
  .status{display:flex; gap:8px; margin-bottom:14px;}
  .statusbtn{flex:1; border-radius:12px; padding:11px; font-weight:800; font-size:14px; border:1px solid var(--line); cursor:pointer; background:var(--bg2); color:var(--muted);}
  .statusbtn[data-on="true"]{background:var(--ballsoft); border-color:var(--ball); color:var(--ball);}
  .statusbtn:active{transform:scale(.98);}
  .poss{display:flex; align-items:center; gap:12px;}
  .poss-num{flex:1; text-align:center;}
  .poss-num .big{font-size:64px; line-height:.85; color:var(--ball); text-shadow:0 0 28px rgba(255,107,44,.3);}
  .poss-num .cap{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-top:4px;}
  .round{width:58px; height:58px; border-radius:999px; border:none; cursor:pointer; font-size:30px; line-height:1; display:flex; align-items:center; justify-content:center;}
  .round:active{transform:scale(.93);}
  .round.add{background:linear-gradient(180deg,#FF8A52,var(--ball)); color:#2a0d00;}
  .round.sub{background:var(--bg2); color:var(--ink); border:1px solid var(--line); font-size:34px;}
  .son-foot{display:flex; justify-content:center; gap:6px; margin-top:12px; font-size:12px; color:var(--muted); font-weight:600;}
  .son-foot b{color:var(--ink);}

  .noterow{display:flex; gap:8px;}
  .noterow input{flex:1; background:var(--bg2); border:1px solid var(--line); border-radius:11px; color:var(--ink); padding:11px; font-size:14px; outline:none;}
  .noterow input:focus{border-color:var(--line2);}
  .noterow input::placeholder{color:var(--muted);}
  .addbtn{border:1px solid var(--line2); background:var(--card2); color:var(--ink); border-radius:11px; padding:0 16px; font-weight:800; cursor:pointer;}
  .qchips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .qchip{background:var(--bg2); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .qchip:active{transform:scale(.96);}

  .ptoggle{display:flex; gap:8px; margin-bottom:10px;}
  .pteam{flex:1; background:var(--bg2); border:1px solid var(--line); color:var(--muted); border-radius:11px; padding:9px; font-size:13px; font-weight:800; cursor:pointer;}
  .pteam[data-on="true"][data-team="us"]{background:rgba(255,194,51,.14); border-color:var(--us2); color:var(--us);}
  .pteam[data-on="true"][data-team="them"]{background:rgba(157,180,255,.14); border-color:var(--them); color:var(--them);}
  .pteam:active{transform:scale(.97);}
  .pcount{font-size:11px; color:var(--muted); font-weight:700;}
  .pchips{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px;}
  .pchip{background:var(--bg2); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:11px 6px; font-size:12px; font-weight:700; cursor:pointer; text-align:center; line-height:1.2;}
  .pchip:active{transform:scale(.96); border-color:var(--line2);}
  .pchips.lchips{grid-template-columns:repeat(2,1fr);}
  .card-title.clp{cursor:pointer; user-select:none; -webkit-user-select:none;}
  .card-title.clp[data-collapsed="true"]{margin-bottom:0;}
  .clp-right{display:flex; align-items:center; gap:10px;}
  .chev{color:var(--muted); font-size:11px; transition:transform .15s ease;}
  .chev[data-collapsed="true"]{transform:rotate(-90deg);}

  .periodbar{display:flex; justify-content:center;}
  .sonnum{display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:14px;}
  .sonnumin{width:72px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; color:var(--ink); font-size:20px; font-weight:800; text-align:center; padding:9px 6px; outline:none; font-family:ui-monospace,Menlo,monospace;}
  .sonnumin:focus{border-color:var(--ball);}
  .sonnumin::placeholder{color:var(--muted);}

  .clk-enable{width:100%; background:var(--card); border:1px dashed var(--line2); color:var(--muted); border-radius:14px; padding:12px; font-size:13px; font-weight:800; cursor:pointer; letter-spacing:.02em;}
  .clk-enable:active{transform:scale(.99);}
  .clock-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .clk-x{background:transparent; border:none; color:var(--muted); font-size:12px; font-weight:800; cursor:pointer; letter-spacing:.04em;}
  .clock-time{font-size:clamp(54px,17vw,82px); text-align:center; line-height:1; color:var(--ink); margin:2px 0 14px;}
  .clock-time.warn{color:var(--ball); text-shadow:0 0 24px rgba(255,107,44,.3);}
  .clock-time.expired{color:var(--danger); text-shadow:0 0 24px rgba(255,92,92,.35);}
  .clock-ctrls{display:flex; gap:8px; margin-bottom:8px;}
  .clkbtn{flex:1; border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:800; cursor:pointer;}
  .clkbtn:active{transform:scale(.98);}
  .clk-start{background:linear-gradient(180deg,#3ED77A,var(--go)); color:#04210F;}
  .clk-start[data-run="true"]{background:linear-gradient(180deg,#FFD25E,var(--us2)); color:#2a1f00;}
  .clk-reset{background:var(--card2); color:var(--ink); border:1px solid var(--line2);}
  .clock-nudge{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;}
  .clock-nudge button{background:var(--bg2); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:11px 4px; font-size:13px; font-weight:800; cursor:pointer; font-family:ui-monospace,Menlo,monospace;}
  .clock-nudge button:active{transform:scale(.95); border-color:var(--line2);}
  .clock-len{display:flex; align-items:center; justify-content:center; gap:8px; color:var(--muted); font-size:12px; font-weight:700;}
  .clk-min{width:58px; background:var(--bg2); border:1px solid var(--line); border-radius:9px; color:var(--ink); font-size:16px; font-weight:800; text-align:center; padding:7px; outline:none; font-family:ui-monospace,Menlo,monospace;}
  .clk-min:focus{border-color:var(--us);}

  .tl-head{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 0;}
  .tl-actions{display:flex; gap:8px;}
  .iconbtn{background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:8px 11px; font-size:12px; font-weight:700; cursor:pointer;}
  .iconbtn:active{transform:scale(.96);}
  .iconbtn.danger{color:var(--danger);}
  .iconbtn:disabled{opacity:.4;}
  .tl{display:flex; flex-direction:column; gap:1px; margin-top:4px;}
  .row{display:flex; align-items:center; gap:11px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .dot{width:9px; height:9px; border-radius:999px; flex:none;}
  .row .txt{flex:1; font-size:14px; font-weight:600; min-width:0;}
  .row .txt .sub2{display:block; font-size:11px; color:var(--muted); font-weight:600; margin-top:1px;}
  .row .sc{font-family:ui-monospace,Menlo,monospace; font-weight:800; font-size:14px; letter-spacing:.02em;}
  .row .del{width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-size:16px; cursor:pointer; flex:none;}
  .row .del:active{background:rgba(255,92,92,.14); color:var(--danger);}
  .row.period-row{justify-content:center; border-bottom:1px solid var(--line2); padding:13px 4px 8px;}
  .row.son-row{background:rgba(255,107,44,.08); border-left:3px solid var(--ball); padding-left:9px; border-radius:0 6px 6px 0;}
  .row.period-row .ptag{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:800;}
  .empty{text-align:center; color:var(--muted); padding:26px 10px; font-size:13px; line-height:1.6;}

  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#06140C; border:1px solid var(--line2); color:var(--ink); padding:11px 16px; border-radius:12px; font-size:13px; font-weight:700; z-index:50; box-shadow:0 10px 30px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s;}
  .toast.show{opacity:1;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; padding:24px; z-index:100;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--card); border:1px solid var(--line2); border-radius:16px; padding:18px; max-width:360px; width:100%;}
  .modal h3{margin:0 0 8px; font-size:17px; font-weight:800;}
  .modal p{margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.5;}
  .modal textarea{width:100%; height:170px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px; font-size:12px; font-family:ui-monospace,Menlo,monospace; resize:none; margin-bottom:14px; outline:none;}
  .modal-actions{display:flex; gap:8px;}
  .modal-actions button{flex:1; border-radius:11px; padding:13px; font-weight:800; font-size:14px; cursor:pointer; border:1px solid var(--line);}
  .mbtn-cancel{background:var(--bg2); color:var(--ink);}
  .mbtn-ok{background:var(--danger); color:#fff; border:none;}
  .mbtn-ok:active,.mbtn-cancel:active{transform:scale(.98);}

  button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--us); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} .btn:active,.round:active,.chip:active{transform:none;} }
</style>
</head>
<body>
  <div class="phone">
    <div class="head">
      <div class="opp">
        <span class="eyebrow">Your team</span>
        <input id="usName" placeholder="Us" aria-label="Your team name" autocomplete="off" />
      </div>
      <div class="opp">
        <span class="eyebrow">Opponent</span>
        <input id="opp" placeholder="Rebels" aria-label="Opponent name" autocomplete="off" />
      </div>
    </div>

    <div class="board">
      <div class="hash"></div>
      <div class="board-row">
        <div class="team"><span class="name" id="usNameLbl">Us</span><span class="num us lcd" id="usScore">0</span></div>
        <span class="dash">&ndash;</span>
        <div class="team"><span class="name" id="themName">Them</span><span class="num them lcd" id="themScore">0</span></div>
      </div>
    </div>

    <div class="periodbar">
      <div class="period">
        <button class="istep" id="pPrev" aria-label="Previous period">&lsaquo;</button>
        <span class="lbl" id="pLbl">1st Q</span>
        <button class="istep" id="pNext" aria-label="Next period">&rsaquo;</button>
      </div>
    </div>

    <button class="clk-enable" id="clockShow">+ Game clock</button>
    <div class="card clock" id="clockCard" style="display:none">
      <div class="clock-head">
        <span class="eyebrow">Game clock</span>
        <button class="clk-x" id="clockHide">Hide</button>
      </div>
      <div class="clock-time lcd" id="clockTime">12:&#8203;00</div>
      <div class="clock-ctrls">
        <button class="clkbtn clk-start" id="clkStartPause" data-run="false">Start</button>
        <button class="clkbtn clk-reset" id="clkReset">Reset</button>
      </div>
      <div class="clock-nudge">
        <button data-nudge="-60">&minus;1:&#8203;00</button>
        <button data-nudge="-10">&minus;0:&#8203;10</button>
        <button data-nudge="10">+0:&#8203;10</button>
        <button data-nudge="60">+1:&#8203;00</button>
      </div>
      <div class="clock-len">
        <span>Period length</span>
        <input class="clk-min" id="clkMin" inputmode="numeric" value="12" aria-label="Period length in minutes" autocomplete="off" />
        <span>min</span>
      </div>
    </div>

    <div class="card" style="padding:12px">
      <button class="btn btn-face" id="faceoff">Faceoff won</button>
    </div>

    <div class="card">
      <div class="card-title clp" id="goalToggle">
        <span class="eyebrow">Goal log</span>
        <span class="clp-right"><span class="chev" id="goalChev">&#9662;</span></span>
      </div>
      <div id="goalBody">
      <div class="gentry">
        <div class="field">
          <label>Assist #</label>
          <input class="numin" id="assist" inputmode="numeric" placeholder="&mdash;" aria-label="Assist number" autocomplete="off" />
        </div>
        <div class="field">
          <label>Scorer #</label>
          <input class="numin" id="scorer" inputmode="numeric" placeholder="&mdash;" aria-label="Scorer number" autocomplete="off" />
        </div>
      </div>
      <div class="toggles">
        <button class="chip" id="unassisted">Unassisted</button>
        <button class="chip" id="guest">Guest player</button>
      </div>
      <button class="btn btn-go" id="logGoal" disabled>+ Log goal</button>
      <button class="btn btn-them" id="themGoal">+ Opponent scored</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title clp" id="lossToggle">
        <span class="eyebrow">Lost possession</span>
        <span class="clp-right"><span class="pcount" id="lossCount">0</span><span class="chev" id="lossChev">&#9662;</span></span>
      </div>
      <div id="lossBody">
        <div class="pchips lchips">
          <button class="pchip" data-loss="Warding">Warding</button>
          <button class="pchip" data-loss="Moving Pick">Moving Pick</button>
          <button class="pchip" data-loss="Crease Violation">Crease Violation</button>
          <button class="pchip" data-loss="Withholding">Withholding</button>
          <button class="pchip" data-loss="Over-and-Back Violation">Over-and-Back Violation</button>
          <button class="pchip" data-loss="Failure to Advance">Failure to Advance</button>
          <button class="pchip" data-loss="Out-of-Bounds">Out-of-Bounds</button>
          <button class="pchip" data-loss="Stick/Equipment">Stick/Equipment</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title clp" id="penToggle">
        <span class="eyebrow">Penalties</span>
        <span class="clp-right"><span class="pcount" id="penCount">Us 0 &middot; Opp 0</span><span class="chev" id="penChev">&#9662;</span></span>
      </div>
      <div id="penBody">
        <div class="ptoggle">
          <button class="pteam" id="penUs" data-team="us" data-on="true">Us</button>
          <button class="pteam" id="penThem" data-team="them">Opponent</button>
        </div>
        <div class="field" id="penPlayerWrap" style="margin-bottom:2px">
          <label>Player #</label>
          <input class="numin" id="penPlayer" inputmode="numeric" placeholder="&mdash;" aria-label="Penalized player number" autocomplete="off" />
        </div>
        <div class="pchips">
          <button class="pchip" data-pen="Slashing">Slashing</button>
          <button class="pchip" data-pen="Holding">Holding</button>
          <button class="pchip" data-pen="Pushing">Pushing</button>
          <button class="pchip" data-pen="Cross-check">Cross-check</button>
          <button class="pchip" data-pen="Tripping">Tripping</button>
          <button class="pchip" data-pen="Illegal body check">Body check</button>
          <button class="pchip" data-pen="Warding">Warding</button>
          <button class="pchip" data-pen="Offsides">Offsides</button>
          <button class="pchip" data-pen="Unsportsmanlike">Unsportsmanlike</button>
        </div>
      </div>
    </div>

    <div class="card son">
      <div class="card-title clp" id="playerToggle">
        <span class="eyebrow" style="color:var(--ball)">My player</span>
        <span class="clp-right"><span class="pcount" id="playerCount">0</span><span class="chev" id="playerChev">&#9662;</span></span>
      </div>
      <div id="playerBody">
        <div class="sonnum">
          <span class="eyebrow">His player #</span>
          <input class="sonnumin" id="sonNumber" inputmode="numeric" placeholder="&mdash;" aria-label="Player number" autocomplete="off" />
        </div>
        <div class="poss">
          <button class="round sub" id="possMinus" aria-label="Remove a possession">&minus;</button>
          <div class="poss-num">
            <div class="big lcd" id="possNum">0</div>
            <div class="cap">Possessions played</div>
          </div>
          <button class="round add" id="possPlus" aria-label="Add a possession">+</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="noterow">
        <input id="note" placeholder="Add a marker &mdash; e.g. 1:30 left" aria-label="Add a note" autocomplete="off" />
        <button class="addbtn" id="addNote">Add</button>
      </div>
      <div class="qchips">
        <button class="qchip" data-note="2:00 left">2:&#8203;00 left</button>
        <button class="qchip" data-note="1:00 left">1:&#8203;00 left</button>
        <button class="qchip" data-note=":30 left">:&#8203;30 left</button>
      </div>
    </div>

    <div>
      <div class="tl-head">
        <span class="eyebrow">Play-by-play</span>
        <div class="tl-actions">
          <button class="iconbtn" id="copyBtn" disabled>Copy recap</button>
          <button class="iconbtn danger" id="newBtn">New game</button>
        </div>
      </div>
      <div class="tl" id="timeline"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Start a new game?</h3>
      <p id="modalMsg"></p>
      <textarea id="modalText" style="display:none" readonly></textarea>
      <div class="modal-actions">
        <button class="mbtn-cancel" id="modalCancel">Cancel</button>
        <button class="mbtn-ok" id="modalOk">Reset game</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "laxTracker.v1";
  var PERIODS = ["1st Q","2nd Q","3rd Q","4th Q","OT"];

  var state = { usName:"", opponent:"", events:[], periodIndex:0, possessions:0, sonNumber:"", penCollapsed:false, lossCollapsed:false, goalCollapsed:false, playerCollapsed:false, clock:{ enabled:false, minutes:12, running:false, endAt:0, remaining:720000 } };
  var ui = { unassisted:false, guest:false, penaltyTeam:"us" };

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var s = JSON.parse(raw);
        state.usName = s.usName || "";
        state.opponent = s.opponent || "";
        state.events = Array.isArray(s.events) ? s.events : [];
        state.periodIndex = s.periodIndex || 0;
        state.possessions = s.possessions || 0;
        state.sonNumber = s.sonNumber || "";
        if(s.clock){
          var ck = s.clock;
          state.clock.enabled = !!ck.enabled;
          state.clock.minutes = (ck.minutes > 0) ? ck.minutes : 12;
          state.clock.running = !!ck.running;
          state.clock.endAt = ck.endAt || 0;
          state.clock.remaining = (typeof ck.remaining === "number") ? ck.remaining : state.clock.minutes*60000;
          if(state.clock.running && !(state.clock.endAt > Date.now())){ state.clock.running = false; state.clock.remaining = 0; }
        }
        state.penCollapsed = !!s.penCollapsed;
        state.lossCollapsed = !!s.lossCollapsed;
        state.goalCollapsed = !!s.goalCollapsed;
        state.playerCollapsed = !!s.playerCollapsed;
      }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var toastTimer;
  function flash(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1700);
  }

  function decorate(){
    var u=0,t=0; return state.events.map(function(e){
      if(e.kind==="goalUs") u++; if(e.kind==="goalThem") t++;
      var c = Object.assign({}, e); c.us=u; c.them=t; return c;
    });
  }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
  function noDetect(s){ return s.replace(/:/g, ":\u200B"); }
  function involvesSon(e){
    var n = (state.sonNumber || "").trim();
    if(!n) return false;
    if(e.kind==="goalUs") return e.scorer===n || e.assist===n;
    if(e.kind==="penalty" && e.team==="us") return e.player===n;
    return false;
  }

  function add(ev){
    ev.id = Date.now() + "_" + Math.random().toString(36).slice(2,7);
    ev.period = PERIODS[state.periodIndex];
    state.events.push(ev); save(); render();
  }

  function render(){
    var dec = decorate();
    var us = dec.length ? dec[dec.length-1].us : 0;
    var them = dec.length ? dec[dec.length-1].them : 0;
    var faceoffs = state.events.filter(function(e){ return e.kind==="faceoff"; }).length;
    var losses = state.events.filter(function(e){ return e.kind==="loss"; }).length;
    var oppName = state.opponent.trim() || "Opponent";

    $("usScore").textContent = us;
    $("themScore").textContent = them;
    $("usNameLbl").textContent = (state.usName.trim() || "Us").slice(0,12);
    $("themName").textContent = (state.opponent.trim() || "Them").slice(0,12);
    $("pLbl").textContent = PERIODS[state.periodIndex];
    $("possNum").textContent = state.possessions;
    $("lossCount").textContent = losses;
    $("themGoal").textContent = "+ " + oppName + " scored";
    $("faceoff").textContent = "Faceoff won" + (faceoffs ? " \u00b7 " + faceoffs : "");

    var penUs = state.events.filter(function(e){ return e.kind==="penalty" && e.team==="us"; }).length;
    var penThem = state.events.filter(function(e){ return e.kind==="penalty" && e.team==="them"; }).length;
    $("penUs").setAttribute("data-on", ui.penaltyTeam==="us" ? "true":"false");
    $("penThem").setAttribute("data-on", ui.penaltyTeam==="them" ? "true":"false");
    $("penPlayerWrap").style.display = ui.penaltyTeam==="us" ? "flex" : "none";
    $("penCount").textContent = "Us " + penUs + " \u00b7 Opp " + penThem;

    $("penBody").style.display = state.penCollapsed ? "none" : "block";
    $("penToggle").setAttribute("data-collapsed", state.penCollapsed ? "true":"false");
    $("penChev").setAttribute("data-collapsed", state.penCollapsed ? "true":"false");
    $("lossBody").style.display = state.lossCollapsed ? "none" : "block";
    $("lossToggle").setAttribute("data-collapsed", state.lossCollapsed ? "true":"false");
    $("lossChev").setAttribute("data-collapsed", state.lossCollapsed ? "true":"false");

    $("goalBody").style.display = state.goalCollapsed ? "none" : "block";
    $("goalToggle").setAttribute("data-collapsed", state.goalCollapsed ? "true":"false");
    $("goalChev").setAttribute("data-collapsed", state.goalCollapsed ? "true":"false");
    $("playerCount").textContent = state.possessions;
    $("playerBody").style.display = state.playerCollapsed ? "none" : "block";
    $("playerToggle").setAttribute("data-collapsed", state.playerCollapsed ? "true":"false");
    $("playerChev").setAttribute("data-collapsed", state.playerCollapsed ? "true":"false");

    var sc = $("scorer").value.trim();
    var lg = $("logGoal");
    lg.disabled = !sc;
    lg.textContent = "+ Log goal" + (sc ? " \u00b7 #" + sc : "");

    $("unassisted").setAttribute("data-on", ui.unassisted ? "true":"false");
    $("guest").setAttribute("data-on", ui.guest ? "true":"false");
    $("assist").disabled = ui.unassisted;
    if(ui.unassisted) $("assist").value = "";

    $("copyBtn").disabled = state.events.length === 0;

    // timeline (newest first)
    var tl = $("timeline");
    if(dec.length === 0){
      tl.innerHTML = '<div class="empty">No plays yet.<br>Log a goal to start the timeline.</div>';
      return;
    }
    var html = "";
    for(var i = dec.length - 1; i >= 0; i--){
      var e = dec[i];
      if(e.kind === "period"){
        html += '<div class="row period-row"><span class="ptag">'+esc(e.label)+'</span></div>';
        continue;
      }
      var dot = e.kind==="goalUs" ? "var(--us)" : e.kind==="goalThem" ? "var(--them)" : e.kind==="sub" ? "var(--ball)" : e.kind==="faceoff" ? "#45D6C2" : e.kind==="penalty" ? "#FF6B6B" : e.kind==="loss" ? "#B08CFF" : "var(--muted)";
      var main = "", sub = "";
      if(e.kind==="goalUs"){
        main = "#"+esc(e.scorer)+(e.guest?" (G)":"")+" goal";
        sub = e.assist ? "assist #"+esc(e.assist) : "unassisted";
      } else if(e.kind==="goalThem"){
        main = oppName+" goal"; sub = "their possession";
      } else if(e.kind==="sub"){
        main = e.dir==="in" ? "Son on field" : "Son to bench";
        sub = e.dir==="in" ? "shift started" : "shift ended";
      } else if(e.kind==="faceoff"){
        main = "Faceoff won"; sub = "possession gained";
      } else if(e.kind==="penalty"){
        if(e.team==="us"){ main = (e.player ? "#"+esc(e.player)+" \u2014 " : "") + esc(e.type); sub = "penalty (us)"; }
        else { main = esc(e.type); sub = "penalty (" + esc(oppName) + ")"; }
      } else if(e.kind==="loss"){
        main = "Lost possession"; sub = esc(e.reason);
      } else if(e.kind==="note"){
        main = noDetect(esc(e.text));
      }
      var score = (e.kind==="goalUs"||e.kind==="goalThem")
        ? '<span class="sc" style="color:'+(e.kind==="goalUs"?"var(--us)":"var(--them)")+'">'+e.us+"-"+e.them+'</span>' : '';
      var subHtml = sub ? '<span class="sub2">'+sub+'</span>' : '';
      html += '<div class="row'+(involvesSon(e) ? ' son-row' : '')+'">'
        + '<span class="dot" style="background:'+dot+'"></span>'
        + '<span class="txt">'+main+subHtml+'</span>'
        + score
        + '<button class="del" data-del="'+e.id+'" aria-label="Delete entry">\u2715</button>'
        + '</div>';
    }
    tl.innerHTML = html;
  }

  function logGoal(){
    var sc = $("scorer").value.trim();
    if(!sc) return;
    add({ kind:"goalUs", scorer:sc, assist: ui.unassisted ? null : ($("assist").value.trim() || null), guest: ui.guest });
    $("scorer").value = ""; $("assist").value = "";
    ui.unassisted = false; ui.guest = false;
    render(); $("scorer").focus();
  }

  function addNote(txt){
    var t = (txt != null ? txt : $("note").value).trim();
    if(!t) return;
    add({ kind:"note", text:t });
    $("note").value = "";
  }

  function logPenalty(type){
    if(ui.penaltyTeam === "us"){
      add({ kind:"penalty", team:"us", type:type, player: ($("penPlayer").value.trim() || null) });
      $("penPlayer").value = "";
    } else {
      add({ kind:"penalty", team:"them", type:type });
    }
  }

  function logLoss(reason){ add({ kind:"loss", reason:reason }); }

  function fmt(ms){
    var s = Math.max(0, Math.ceil(ms/1000));
    var m = Math.floor(s/60), ss = s%60;
    return m + ":\u200B" + (ss<10?"0":"") + ss;
  }
  function onClockExpire(){
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    flash("Period time expired \u2014 tap Reset for the next one");
  }
  function updateClock(){
    var c = state.clock;
    $("clockCard").style.display = c.enabled ? "block" : "none";
    $("clockShow").style.display = c.enabled ? "none" : "block";
    if(!c.enabled) return;
    var rem;
    if(c.running){
      rem = c.endAt - Date.now();
      if(rem <= 0){ rem = 0; c.running = false; c.remaining = 0; onClockExpire(); save(); }
      else { c.remaining = rem; }
    } else { rem = c.remaining; }
    var t = $("clockTime");
    t.textContent = fmt(rem);
    t.className = "clock-time lcd" + (rem<=0 ? " expired" : (rem<=60000 ? " warn" : ""));
    var sp = $("clkStartPause");
    sp.textContent = c.running ? "Pause" : "Start";
    sp.setAttribute("data-run", c.running ? "true" : "false");
  }
  function clkStartPause(){
    var c = state.clock;
    if(c.running){ c.remaining = Math.max(0, c.endAt - Date.now()); c.running = false; }
    else { if(c.remaining <= 0) return; c.endAt = Date.now() + c.remaining; c.running = true; }
    save(); updateClock();
  }
  function clkReset(){
    var c = state.clock;
    c.running = false; c.endAt = 0; c.remaining = c.minutes*60000;
    save(); updateClock();
  }
  function clkNudge(sec){
    var c = state.clock, d = sec*1000, max = 99*60000;
    if(c.running){
      c.endAt += d;
      if(c.endAt - Date.now() < 0){ c.endAt = Date.now(); }
      if(c.endAt - Date.now() > max){ c.endAt = Date.now() + max; }
    } else {
      c.remaining = Math.min(max, Math.max(0, c.remaining + d));
    }
    save(); updateClock();
  }
  function clkSetMin(v){
    var m = parseInt(v,10); if(isNaN(m)) return;
    m = Math.min(60, Math.max(1, m));
    state.clock.minutes = m;
    if(!state.clock.running){ state.clock.remaining = m*60000; }
    save(); updateClock();
  }
  function clkEnable(on){
    state.clock.enabled = on;
    if(on && !state.clock.running && state.clock.remaining <= 0){ state.clock.remaining = state.clock.minutes*60000; }
    save(); updateClock();
  }

  function stepPeriod(dir){
    var next = Math.min(PERIODS.length-1, Math.max(0, state.periodIndex + dir));
    if(next !== state.periodIndex){
      state.periodIndex = next;
      if(dir > 0) add({ kind:"period", label: PERIODS[next] });
      else { save(); render(); }
    }
  }

  function buildRecap(){
    var dec = decorate();
    var usName = state.usName.trim() || "Us";
    var opp = state.opponent.trim() || "Opponent";
    var us = dec.length ? dec[dec.length-1].us : 0;
    var them = dec.length ? dec[dec.length-1].them : 0;
    var faceoffs = state.events.filter(function(e){ return e.kind==="faceoff"; }).length;
    var losses = state.events.filter(function(e){ return e.kind==="loss"; }).length;
    var penUs = state.events.filter(function(e){ return e.kind==="penalty" && e.team==="us"; }).length;
    var penThem = state.events.filter(function(e){ return e.kind==="penalty" && e.team==="them"; }).length;
    var L = [usName + " vs " + opp, ""];
    dec.forEach(function(e){
      var star = involvesSon(e) ? "\u2605 " : "";
      if(e.kind==="period"){ L.push("", "\u2014 "+e.label+" \u2014"); }
      else if(e.kind==="goalUs"){
        L.push(star + "#"+e.scorer+(e.guest?" (guest)":"")+" goal"+(e.assist?", #"+e.assist+" assist":", unassisted"));
        L.push(e.us+"-"+e.them);
      } else if(e.kind==="goalThem"){ L.push(opp+" goal"); L.push(e.us+"-"+e.them); }
      else if(e.kind==="sub"){ L.push(e.dir==="in" ? "Son in" : "Son out"); }
      else if(e.kind==="faceoff"){ L.push("Faceoff won"); }
      else if(e.kind==="loss"){ L.push("Lost possession: " + e.reason); }
      else if(e.kind==="penalty"){
        if(e.team==="us"){ L.push(star + "Penalty: " + (e.player ? "#"+e.player+" " : "") + e.type); }
        else { L.push("Penalty: " + opp + " " + e.type); }
      }
      else if(e.kind==="note"){ L.push(e.text); }
    });
    var n = (state.sonNumber || "").trim();
    var sonLine;
    if(n){
      var sg = state.events.filter(function(e){ return e.kind==="goalUs" && e.scorer===n; }).length;
      var sa = state.events.filter(function(e){ return e.kind==="goalUs" && e.assist===n; }).length;
      var sp = state.events.filter(function(e){ return e.kind==="penalty" && e.team==="us" && e.player===n; }).length;
      sonLine = "\u2605 Son (#"+n+") \u2014 goals: "+sg+", assists: "+sa+", penalties: "+sp+", possessions: "+state.possessions;
    } else {
      sonLine = "Son \u2014 possessions: "+state.possessions;
    }
    L.push("", "Final: "+us+"-"+them, "Faceoffs won: "+faceoffs, "Lost possessions: "+losses, "Penalties \u2014 us: "+penUs+", "+opp+": "+penThem, sonLine);
    return L.join("\n");
  }

  var pendingOk = null;
  function showModal(opts){
    $("modalTitle").textContent = opts.title;
    var msg = $("modalMsg");
    msg.textContent = opts.msg || "";
    msg.style.display = opts.msg ? "block" : "none";
    var ta = $("modalText");
    if(opts.text != null){ ta.style.display = "block"; ta.value = opts.text; }
    else { ta.style.display = "none"; }
    var ok = $("modalOk");
    if(opts.okLabel){ ok.style.display = "block"; ok.textContent = opts.okLabel; }
    else { ok.style.display = "none"; }
    $("modalCancel").textContent = opts.cancelLabel || "Cancel";
    pendingOk = opts.onOk || null;
    $("modal").classList.add("show");
    if(opts.text != null){ setTimeout(function(){ ta.focus(); ta.select(); }, 60); }
  }
  function closeModal(){ $("modal").classList.remove("show"); pendingOk = null; }

  function copyRecap(){
    var text = buildRecap();
    function fallback(){ showModal({ title:"Copy recap", msg:"Select the text below, then copy it.", text:text, cancelLabel:"Close" }); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ flash("Recap copied"); }, fallback);
    } else { fallback(); }
  }

  function newGame(){
    showModal({
      title:"Start a new game?",
      msg:"This clears the score, timeline and son's counts. This can't be undone.",
      okLabel:"Reset game",
      onOk:function(){
        var ck = state.clock;
        state = { usName:state.usName, opponent:"", events:[], periodIndex:0, possessions:0, sonNumber:state.sonNumber, penCollapsed:state.penCollapsed, lossCollapsed:state.lossCollapsed, goalCollapsed:state.goalCollapsed, playerCollapsed:state.playerCollapsed,
          clock:{ enabled:ck.enabled, minutes:ck.minutes, running:false, endAt:0, remaining:ck.minutes*60000 } };
        ui = { unassisted:false, guest:false, penaltyTeam:"us" };
        $("opp").value = ""; $("scorer").value = ""; $("assist").value = ""; $("note").value = ""; $("penPlayer").value = "";
        $("clkMin").value = state.clock.minutes;
        save(); render(); updateClock(); flash("New game ready");
      }
    });
  }

  // wire up
  load();
  $("opp").value = state.opponent;
  $("usName").value = state.usName;
  $("sonNumber").value = state.sonNumber;

  $("usName").addEventListener("input", function(e){ state.usName = e.target.value; save(); render(); });
  $("opp").addEventListener("input", function(e){ state.opponent = e.target.value; save(); render(); });
  $("pPrev").addEventListener("click", function(){ stepPeriod(-1); });
  $("pNext").addEventListener("click", function(){ stepPeriod(1); });

  $("scorer").addEventListener("input", function(e){ e.target.value = e.target.value.replace(/[^0-9]/g,""); render(); });
  $("assist").addEventListener("input", function(e){ e.target.value = e.target.value.replace(/[^0-9]/g,""); });
  $("scorer").addEventListener("keydown", function(e){ if(e.key==="Enter") logGoal(); });
  $("assist").addEventListener("keydown", function(e){ if(e.key==="Enter") logGoal(); });
  $("unassisted").addEventListener("click", function(){ ui.unassisted = !ui.unassisted; render(); });
  $("guest").addEventListener("click", function(){ ui.guest = !ui.guest; render(); });
  $("logGoal").addEventListener("click", logGoal);
  $("themGoal").addEventListener("click", function(){ add({ kind:"goalThem" }); });
  $("faceoff").addEventListener("click", function(){ add({ kind:"faceoff" }); });

  $("penUs").addEventListener("click", function(){ ui.penaltyTeam = "us"; render(); });
  $("penThem").addEventListener("click", function(){ ui.penaltyTeam = "them"; render(); });
  $("penPlayer").addEventListener("input", function(e){ e.target.value = e.target.value.replace(/[^0-9]/g,""); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-pen]"), function(b){
    b.addEventListener("click", function(){ logPenalty(b.getAttribute("data-pen")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-loss]"), function(b){
    b.addEventListener("click", function(){ logLoss(b.getAttribute("data-loss")); });
  });

  $("penToggle").addEventListener("click", function(){ state.penCollapsed = !state.penCollapsed; save(); render(); });
  $("lossToggle").addEventListener("click", function(){ state.lossCollapsed = !state.lossCollapsed; save(); render(); });
  $("goalToggle").addEventListener("click", function(){ state.goalCollapsed = !state.goalCollapsed; save(); render(); });
  $("playerToggle").addEventListener("click", function(){ state.playerCollapsed = !state.playerCollapsed; save(); render(); });

  $("clockShow").addEventListener("click", function(){ clkEnable(true); });
  $("clockHide").addEventListener("click", function(){ clkEnable(false); });
  $("clkStartPause").addEventListener("click", clkStartPause);
  $("clkReset").addEventListener("click", clkReset);
  Array.prototype.forEach.call(document.querySelectorAll("[data-nudge]"), function(b){
    b.addEventListener("click", function(){ clkNudge(parseInt(b.getAttribute("data-nudge"),10)); });
  });
  $("clkMin").addEventListener("input", function(e){ e.target.value = e.target.value.replace(/[^0-9]/g,""); clkSetMin(e.target.value); });

  $("sonNumber").addEventListener("input", function(e){ e.target.value = e.target.value.replace(/[^0-9]/g,""); state.sonNumber = e.target.value; save(); });
  $("possPlus").addEventListener("click", function(){ state.possessions++; save(); render(); });
  $("possMinus").addEventListener("click", function(){ state.possessions = Math.max(0, state.possessions-1); save(); render(); });

  $("addNote").addEventListener("click", function(){ addNote(); });
  $("note").addEventListener("keydown", function(e){ if(e.key==="Enter") addNote(); });
  Array.prototype.forEach.call(document.querySelectorAll(".qchip"), function(b){
    b.addEventListener("click", function(){ addNote(b.getAttribute("data-note")); });
  });

  $("copyBtn").addEventListener("click", copyRecap);
  $("newBtn").addEventListener("click", newGame);

  $("modalCancel").addEventListener("click", closeModal);
  $("modalOk").addEventListener("click", function(){ var fn = pendingOk; closeModal(); if(fn) fn(); });
  $("modal").addEventListener("click", function(e){ if(e.target === $("modal")) closeModal(); });

  $("timeline").addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest("[data-del]") : null;
    if(btn){ var id = btn.getAttribute("data-del");
      state.events = state.events.filter(function(ev){ return ev.id !== id; });
      save(); render();
    }
  });

  render();
  $("clkMin").value = state.clock.minutes;
  updateClock();
  setInterval(function(){ if(state.clock.enabled) updateClock(); }, 250);
})();
</script>
</body>
</html>
